scalar DateTime

type Folder {
  id: ID!
  name: String!
  createdAt: DateTime!
  updatedAt: DateTime!
  bookmarks: [Bookmark!]!
}

type Bookmark {
  id: ID!
  title: String!
  url: String!
  description: String
  folderId: ID!
  folder: Folder!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type BookmarkEdge {
  cursor: String!
  node: Bookmark!
}

type BookmarkConnection {
  edges: [BookmarkEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

input CreateFolderInput {
  name: String!
}

input CreateBookmarkInput {
  title: String!
  url: String!
  description: String
  folderId: ID!
}

input UpdateBookmarkInput {
  title: String
  url: String
  description: String
  folderId: ID
}

type Query {
  folders: [Folder!]!
  folder(id: ID!): Folder
  bookmarks(
    folderId: ID
    search: String
    take: Int
    cursor: String
  ): BookmarkConnection!
}

type Mutation {
  createFolder(input: CreateFolderInput!): Folder!
  createBookmark(input: CreateBookmarkInput!): Bookmark!
  updateBookmark(id: ID!, input: UpdateBookmarkInput!): Bookmark!
  deleteBookmark(id: ID!): Boolean!
  moveBookmark(id: ID!, folderId: ID!): Bookmark!
}