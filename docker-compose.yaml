version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookmark_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bookmark_manager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookmark_api
    restart: on-failure
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/bookmark_manager?schema=public"
      PORT: 4000
    ports:
      - "4000:4000"

volumes:
  pgdata: